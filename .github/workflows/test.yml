name: Test

on:
  push:
    branches:
      - '**'   # run on all branches

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
        with:
          node-version: 'lts/*'

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test